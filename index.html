<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Chocolate Day, Sara!</title>
    <style>
        :root {
            --dark-cocoa: #3d0c02;
            --milk-chocolate: #7b3f00;
            --caramel: #c68642;
            --heart-red: #ff4d6d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, var(--dark-cocoa) 0%, var(--milk-chocolate) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 500px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--caramel); }
        p { font-size: 1.2rem; line-height: 1.6; }

        .choco-box {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            margin: 20px 0;
        }

        .choco-box:hover { transform: scale(1.2) rotate(5deg); }

        .hidden-message {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Chocolate Day!</h1>
        <p>To my favorite person, <strong>Sara Kutty</strong>.</p>
        
        <div class="choco-box" id="box" onclick="reveal()">🎁</div>
        
        <div class="hidden-message" id="message">
            <p>You’re sweeter than any chocolate in the world. 🍫</p>
            <p style="color: var(--caramel); font-style: italic;">
                "When Afrin gives you chocolates, shut up and eat it. Who knows, maybe by the end of the day, you might be having a Amul Dark Chocolate in your hand?!"
            </p>
            <div style="font-size: 2rem; margin-top: 15px;">❤️</div>
        </div>
    </div>

    <script>
        function reveal() {
            document.getElementById('box').innerHTML = '🍫';
            document.getElementById('message').style.display = 'block';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 10 + "px";
            heart.style.animationDuration = Math.random() * 3 + 4 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 7000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
